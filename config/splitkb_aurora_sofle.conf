# splitkb Aurora Sofle v2 + nice!nano v2
# Hardware (OLED, encoders, LED strip) is defined by ZMK's splitkb_aurora_sofle
# shield; this file only enables and tunes the features.

# --- SSD1306 128x32 OLED ---
CONFIG_ZMK_DISPLAY=y

# --- EC11 rotary encoders ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- RGB: WS2812B underglow + SK6812 MINI-E per-key (one chain, see keymap) ---
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
# 35 LEDs per half on the nice!nano's 3.3V regulator: cap brightness so full
# white can't brown out the controller.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# The OLED shares the nice!nano's switched VCC with the LEDs. Leaving this off
# keeps the OLED on when RGB is toggled off, but the LEDs still draw idle
# current from the battery. Set to y if you prefer battery life over the OLED.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# --- Power / radio ---
CONFIG_ZMK_SLEEP=y
# Needed for the &soft_off key on the System layer. Wake with the reset button.
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Debounce ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
